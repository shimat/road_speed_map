[project]
name = "road-speed-map"
version = "0.1.0"
description = "道路最高速度を根拠と確度つきで可視化するPoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmium>=4.3,<5",
    "pydeck>=0.9.1,<1",
    "shapely>=2.1,<3",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
